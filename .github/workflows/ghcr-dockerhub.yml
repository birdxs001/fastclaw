name: build-and-push to ghcr and dockerhub

on:
  push:
    branches: [dev, main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 覆盖镜像 tag(可选)
        required: false

permissions:
  contents: read
  packages: write

env:
  # GHCR 镜像基础名（用于后续 build 和 merge，但 meta 中会重新显式构造）
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/fastclaw

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha7: ${{ steps.meta.outputs.sha7 }}
      date: ${{ steps.meta.outputs.date }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推导版本号
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=$(git describe --tags --always --dirty)" >> $GITHUB_OUTPUT
          fi
          echo "sha7=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: 生成所有镜像标签（GHCR + Docker Hub）
        id: tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # 显式构造 GHCR 镜像名（避免依赖全局 env 解析问题）
          GHCR_IMAGE="ghcr.io/${{ github.repository_owner }}/fastclaw"
          VERSION="${{ steps.meta.outputs.version }}"
          SHA7="${{ steps.meta.outputs.sha7 }}"

          # 初始 GHCR 标签（version 和 sha7）
          TAGS="${GHCR_IMAGE}:${VERSION},${GHCR_IMAGE}:${SHA7}"

          # 分支额外标签
          case "${{ github.ref }}" in
            refs/heads/dev)  TAGS="${TAGS},${GHCR_IMAGE}:dev" ;;
            refs/heads/main) TAGS="${TAGS},${GHCR_IMAGE}:latest" ;;
          esac

          # 若配置了 Docker Hub 用户名，则添加 Docker Hub 标签
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            DOCKERHUB_IMAGE="docker.io/${DOCKERHUB_USERNAME}/fastclaw"
            TAGS="${TAGS},${DOCKERHUB_IMAGE}:${VERSION},${DOCKERHUB_IMAGE}:${SHA7}"
            case "${{ github.ref }}" in
              refs/heads/dev)  TAGS="${TAGS},${DOCKERHUB_IMAGE}:dev" ;;
              refs/heads/main) TAGS="${TAGS},${DOCKERHUB_IMAGE}:latest" ;;
            esac
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          # 调试输出（可查看标签列表）
          echo "Generated tags: ${TAGS}"

  build:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 平台标识
        id: slug
        run: echo "slug=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - name: 构建并推送单架构镜像（仅 GHCR）
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfilefix
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,"name=${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            COMMIT=${{ needs.meta.outputs.sha7 }}
            DATE=${{ needs.meta.outputs.date }}
          cache-from: type=gha,scope=${{ steps.slug.outputs.slug }}
          cache-to: type=gha,scope=${{ steps.slug.outputs.slug }},mode=max

      - name: 导出 digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.slug.outputs.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [meta, build]
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub（如配置）
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: 创建并推送 manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          TAGS="${{ needs.meta.outputs.tags }}"
          # 检查标签是否为空（不应为空）
          if [ -z "$TAGS" ]; then
            echo "错误：未生成任何标签，请检查 meta 步骤"
            exit 1
          fi
          echo "合并标签: ${TAGS}"

          TAG_ARGS=""
          IFS=',' read -ra TAG_ARRAY <<< "$TAGS"
          for t in "${TAG_ARRAY[@]}"; do
            TAG_ARGS="$TAG_ARGS -t $t"
          done

          # 引用 GHCR 上的单架构 digest
          docker buildx imagetools create $TAG_ARGS \
            $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)
