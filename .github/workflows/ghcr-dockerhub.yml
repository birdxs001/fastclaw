name: build-and-push to ghcr and dockerhub

on:
  push:
    branches: [dev, main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 覆盖镜像 tag(可选)
        required: false

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/fastclaw

jobs:
  # --- 元数据：版本、短 SHA、日期，并生成所有标签（GHCR + Docker Hub） ---
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha7: ${{ steps.meta.outputs.sha7 }}
      date: ${{ steps.meta.outputs.date }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推导版本并生成标签
        id: meta
        run: |
          # 1. 版本号
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="$(git describe --tags --always --dirty)"
          fi
          SHA7="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "sha7=${SHA7}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT

          # 2. GHCR 标签（始终存在）
          GHCR_IMAGE="ghcr.io/${{ github.repository_owner }}/fastclaw"
          TAGS="${GHCR_IMAGE}:${VERSION},${GHCR_IMAGE}:${SHA7}"
          case "${{ github.ref }}" in
            refs/heads/dev)  TAGS="${TAGS},${GHCR_IMAGE}:dev" ;;
            refs/heads/main) TAGS="${TAGS},${GHCR_IMAGE}:latest" ;;
          esac

          # 3. Docker Hub 标签（仅当配置了用户名）
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            DOCKERHUB_IMAGE="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/fastclaw"
            TAGS="${TAGS},${DOCKERHUB_IMAGE}:${VERSION},${DOCKERHUB_IMAGE}:${SHA7}"
            case "${{ github.ref }}" in
              refs/heads/dev)  TAGS="${TAGS},${DOCKERHUB_IMAGE}:dev" ;;
              refs/heads/main) TAGS="${TAGS},${DOCKERHUB_IMAGE}:latest" ;;
            esac
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${TAGS}"   # 调试输出，可在日志中查看

  # --- 并行构建每个架构，仅推送到 GHCR（中间存储） ---
  build:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 平台标识（用于缓存和 digest 文件）
        id: slug
        run: echo "slug=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - name: 构建并推送单架构镜像（仅 GHCR）
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfilefix
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,"name=${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            COMMIT=${{ needs.meta.outputs.sha7 }}
            DATE=${{ needs.meta.outputs.date }}
          cache-from: type=gha,scope=${{ steps.slug.outputs.slug }}
          cache-to: type=gha,scope=${{ steps.slug.outputs.slug }},mode=max

      - name: 导出 digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.slug.outputs.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # --- 合并所有架构的 digest，创建多架构 manifest 并推送到 GHCR + Docker Hub ---
  merge:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      # 登录 GHCR（必需）
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 登录 Docker Hub（仅当生成的标签包含 docker.io）
      - name: 登录 Docker Hub
        if: contains(needs.meta.outputs.tags, 'docker.io')
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: 创建并推送 manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          TAGS="${{ needs.meta.outputs.tags }}"
          if [ -z "$TAGS" ]; then
            echo "错误：未生成任何标签，请检查 meta 步骤"
            exit 1
          fi
          echo "合并标签: ${TAGS}"

          TAG_ARGS=""
          IFS=',' read -ra TAG_ARRAY <<< "$TAGS"
          for t in "${TAG_ARRAY[@]}"; do
            TAG_ARGS="$TAG_ARGS -t $t"
          done

          # 引用 GHCR 上的单架构镜像 digest
          docker buildx imagetools create $TAG_ARGS \
            $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)
